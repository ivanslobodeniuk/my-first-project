<!DOCTYPE html>

  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      background-color: #f9f9f9;
    }
    .category {
      margin: 20px;
      padding: 20px;
      border: 1px solid #ccc;
      border-radius: 10px;
      color: #333;
    }
    .domestic {
      background-color: #ffcccb;
    }
    .wild {
      background-color: #c8e6c9;
    }
    .item {
      margin: 10px;
      padding: 10px;
      display: inline-block;
      border: 1px solid #ccc;
      border-radius: 10px;
      background-color: #fff;
      width: 200px;
    }
    .item img {
      width: 200px;
      height: 200px;
      border-radius: 10px;
      margin-bottom: 10px;
    }
    .speaker {
      cursor: pointer;
      margin-left: 8px;
      font-size: 20px;
      transition: color 0.3s;
    }
    .speaker:hover {
      text-shadow: 0 0 10px rgba(0, 150, 136, 0.8);
    }
  </style>
</head>
